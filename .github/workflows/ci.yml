name: GoalCoach CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Check uv.lock Synchronization
        run: uv lock --check

      - name: Install Project & All Test Dependencies
        run: uv sync --all-extras --dev

      - name: Static Analysis & Linting (Ruff)
        run: uv run ruff check src/ apps/ tests/

      - name: Code Formatting Check (Ruff)
        run: uv run ruff format --check src/ apps/ tests/

      - name: Run Unit Tests
        run: uv run pytest tests/unit/ -v

      - name: Run Integration Tests
        env:
          # Use local in-memory/dummy configs for CI test runs
          GOALCOACH_ENVIRONMENT: "testing"
          GOALCOACH_LLM_API_KEY: "ci-mock-token"
          GOALCOACH_ENABLE_VECTOR_RETRIEVAL: "true"
        run: uv run pytest tests/integration/ -v