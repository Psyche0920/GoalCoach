chartCategoricalColors = ["#88c0d0", "#81a1c1", "#5e81ac", "#a3be8c", "#ebcb8b", "#d08770", "#bf616a", "#b48ead"]

blueColor = "#81a1c1"
greenColor = "#a3be8c"
