[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goalcoach"
version = "0.1.0"
description = "Terminal-based agentic learning coach for HSK Chinese"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pydantic-ai-slim[openai]>=1.30,<2",
  "rich>=15,<16",
  "sqlalchemy>=2.0,<3",
]
